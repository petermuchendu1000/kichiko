<!-- Elopis brand mark — the expectation operator.
     E[X] is the expected value of X. A prediction market's price IS the
     expected value of a binary payoff, so the mark is the product's own
     notation rather than a picture of something. The brackets are left empty:
     the question not yet answered. Pure vector, one path set, no raster. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Elopis">
  <rect width="64" height="64" rx="14" fill="#1452F0"/>
  <g transform="translate(32 32) scale(0.92) translate(-32 -32)">
  <g fill="#fff">
    <!-- E -->
    <rect x="22" y="17" width="7" height="30"/>
    <rect x="22" y="17" width="20" height="7"/>
    <rect x="22" y="28.5" width="16" height="7"/>
    <rect x="22" y="40" width="20" height="7"/>
  </g>
  <!-- the brackets: left open, right open -->
  <g fill="none" stroke="#fff" stroke-width="4.75" stroke-linecap="square">
    <path d="M17 15 H13 V49 H17"/>
    <path d="M47 15 H51 V49 H47"/>
  </g>
  </g>
</svg>
