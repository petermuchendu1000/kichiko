[package]
name = "kengine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rand = { version = "0.8", features = ["small_rng"] }

[[bench]]
name = "engine"
harness = false
