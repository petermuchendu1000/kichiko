<!--
  MarketPips — passwordless email one-time CODE (Supabase "magic_link" template).

  This template is used by supabase.auth.signInWithOtp(). It intentionally
  renders {{ .Token }} (the 6-digit code) and NOT {{ .ConfirmationURL }}, so the
  user receives a CODE they type back into the in-context AuthDialog — never a
  magic link that opens a new tab and loses the order ticket they were building.

  Applied to a project via `supabase config push` (see supabase/config.toml,
  [auth.email.template.magic_link]) or the Auth > Email Templates dashboard.
  Table-based, inline-styled markup for maximum email-client compatibility.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0f14;margin:0;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="width:440px;max-width:92%;background:#111820;border:1px solid #1f2a37;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="padding:32px 32px 8px 32px;">
            <div style="font-size:20px;font-weight:800;color:#e8f0f7;letter-spacing:-0.02em;">🎯 MarketPips</div>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 0 32px;">
            <h1 style="margin:0 0 8px 0;font-size:22px;line-height:1.3;font-weight:700;color:#e8f0f7;">Your sign-in code</h1>
            <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#9fb0c0;">
              Enter this code to finish signing in. It expires in 60&nbsp;minutes and can be used once.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px;">
            <div style="background:#0b0f14;border:1px solid #223040;border-radius:12px;padding:20px;text-align:center;">
              <span style="font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:36px;font-weight:700;letter-spacing:12px;color:#3ddc84;">{{ .Token }}</span>
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 32px 32px;">
            <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7d8f;">
              If you didn’t request this, you can safely ignore this email — no one can sign in without the code above.
            </p>
          </td>
        </tr>
      </table>
      <p style="margin:20px 0 0 0;font-size:12px;color:#4a5a6a;">MarketPips · East Africa’s prediction market</p>
    </td>
  </tr>
</table>
