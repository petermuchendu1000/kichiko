<!--
  MarketPips - reauthentication CODE (Supabase "reauthentication" template).
  Sent when a user must confirm a sensitive change. Renders {{ .Token }}.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0f14;margin:0;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="width:440px;max-width:92%;background:#111820;border:1px solid #1f2a37;border-radius:16px;">
      <tr><td style="padding:32px 32px 4px 32px;">
        <div style="font-size:20px;font-weight:800;color:#e8f0f7;">🎯 MarketPips</div>
      </td></tr>
      <tr><td style="padding:12px 32px 0 32px;">
        <h1 style="margin:0 0 8px 0;font-size:22px;line-height:1.3;font-weight:700;color:#e8f0f7;">Confirm it is you</h1>
        <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#9fb0c0;">Enter this code to confirm the change to your account. It expires in 60 minutes.</p>
      </td></tr>
      <tr><td style="padding:0 32px;">
        <div style="background:#0b0f14;border:1px solid #223040;border-radius:12px;padding:20px;text-align:center;">
          <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:36px;font-weight:700;letter-spacing:12px;color:#3ddc84;">{{ .Token }}</span>
        </div>
      </td></tr>
      <tr><td style="padding:20px 32px 32px 32px;">
        <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7d8f;">If you did not start this, please secure your account and ignore this email.</p>
      </td></tr>
    </table>
    <p style="margin:20px 0 0 0;font-size:12px;color:#4a5a6a;">MarketPips, East Africa's prediction market platform</p>
  </td></tr>
</table>
