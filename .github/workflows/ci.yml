# Kichiko CI — quality gates (Module 16.1)
# lint / type-check / unit run in parallel, then build (+ bundle budget),
# migration-lint, and security scans. Docs-only PRs skip the heavy jobs.
name: Kichiko CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # ------------------------------------------------------------------
  # Change detection — lets docs-only changes skip the heavy pipeline.
  # ------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - 'Dockerfile'
              - 'fly.toml'
            migrations:
              - 'supabase/migrations/**'
              - 'scripts/lint_migrations.py'
              - 'scripts/security/audit_definer_exposure.py'
              - 'scripts/security/definer_exposure_allowlist.json'

  # ------------------------------------------------------------------
  # Parallel quality gates.
  # ------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run --workspace apps/web test

  # ------------------------------------------------------------------
  # i18n integrity: catalog keys (no orphans) + pseudo-locale in sync.
  # (Modules 17.3/17.4 — cheap, no npm ci needed; pure node scripts.)
  # ------------------------------------------------------------------
  i18n:
    name: i18n check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-i18n-keys.mjs
      - run: node scripts/gen-pseudo-locale.mjs --check

  # ------------------------------------------------------------------
  # Build + performance budget (needs the quality gates green).
  # ------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit, i18n]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm run build 2>&1 | tee build.log
      - name: Bundle-size budget (first-load JS)
        env:
          BUNDLE_BUDGET_KB: '130'
        run: node scripts/check-bundle-budget.mjs build.log

  # ------------------------------------------------------------------
  # DB migration lint (naming/numbering/parse/destructive opt-in).
  # ------------------------------------------------------------------
  migration-lint:
    name: Migration lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "pglast>=6,<8"
      - run: python scripts/lint_migrations.py supabase/migrations
      # Seals the "unguarded SECURITY DEFINER exposed to client roles" class:
      # bans blanket 'GRANT EXECUTE ON ALL FUNCTIONS ... TO anon/authenticated'.
      # (Authoritative live check runs in security-audit.yml against the DB.)
      - name: Definer-exposure static gate
        run: python scripts/security/audit_definer_exposure.py --migrations supabase/migrations

  # ------------------------------------------------------------------
  # Security scans. npm audit + dependency review are non-blocking for
  # now (baseline collection); gitleaks (secret scanning) is blocking.
  # NOTE: never run `npm audit fix --force` — see docs/DEPLOYMENT.md.
  # ------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: npm audit (high+) — non-blocking baseline
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # M6 — Dependency review, fully green AND fully enforcing.
  # The Dependency graph is enabled on this repo, so the review runs and gates
  # PRs on high-severity advisories (security intent preserved). We DON'T use a
  # job-level `continue-on-error` (that leaves a red ✗ on the check even when the
  # run passes). Instead we probe the dependency-graph API first: when it's
  # available (the normal path) we enforce; when it's genuinely unavailable
  # (e.g. a fork, or the graph is ever disabled) we skip with a notice so the
  # check is a clean green ✓ rather than a hard failure that blocks every PR.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe dependency graph availability
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/compare/${base}...${head}") || status=000
          echo "dependency-graph/compare -> HTTP ${status}"
          if [ "${status}" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dependency review skipped::Dependency graph unavailable (HTTP ${status}) for this ref — skipping as non-fatal so the PR check stays green."
          fi
      - name: Dependency review (enforced when graph available)
        if: steps.probe.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ------------------------------------------------------------------
  # Accessibility: axe-core (WCAG 2.1 AA) across key public pages (Module 17.1).
  # Non-blocking baseline while we collect the first live report against a
  # content-bearing DB; promote to blocking (remove continue-on-error) once the
  # first run confirms zero critical/serious. jsx-a11y already gates in `lint`.
  # ------------------------------------------------------------------
  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx --workspace apps/web playwright install --with-deps chromium
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm run build
      - name: Run axe accessibility checks
        # The Playwright webServer runs `next start`; give it the same runtime
        # Supabase config the Build got, else DB-backed pages (Home, Markets)
        # hang and page.goto times out.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm --workspace apps/web run test:a11y

  # ------------------------------------------------------------------
  # Lighthouse CI (performance/a11y budgets) — non-blocking baseline.
  # ------------------------------------------------------------------
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm run build
      - name: Run Lighthouse CI
        # Pass runtime Supabase config to `next start` so DB-backed pages render
        # (otherwise `/` hangs and wait-on times out), and give the slower CI
        # runner more headroom to boot before probing.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          npm install -g @lhci/cli@0.14.x
          npm --workspace apps/web run start &
          npx --yes wait-on http-get://localhost:3000/ -t 180000
          lhci autorun --config=./lighthouserc.json || true

  # ------------------------------------------------------------------
  # INF-06 — End-to-end user journeys (Playwright) as a BLOCKING gate.
  # Mirrors the (proven) a11y job setup: build with runtime Supabase config,
  # then Playwright's webServer runs `next start`. Runs the FULL e2e suite and
  # is REQUIRED — it is included in the "CI green" aggregate below. Specs are
  # read-only public journeys (home/markets/detail/search/leaderboard/legal/
  # auth-modal/currency); retries=1 + generous CI timeouts (playwright.config.ts)
  # absorb transient SSR latency from the remote eu-west-1 DB.
  # ------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx --workspace apps/web playwright install --with-deps chromium
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm run build
      - name: Run Playwright E2E suite
        # Playwright's webServer runs `next start`; give it the same runtime
        # Supabase config the Build got, else DB-backed pages (Home, Markets)
        # hang and page.goto times out.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm --workspace apps/web run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ------------------------------------------------------------------
  # INF-03 — CLOB matching-engine invariant harnesses against an EPHEMERAL
  # Postgres, as a BLOCKING gate. Spins up a throwaway PG17 (real `http`
  # extension; pg_cron shimmed), applies the Supabase bootstrap + ALL
  # migrations, seeds 6 users, then runs the fuzz + two-sided + abuse-cap
  # harnesses (each rolls back — nothing persists). Guards the money path:
  # value-conservation, share-conservation (YES==NO), no-oversell, self-trade
  # prevention, price-time priority, escrow exactness, cost-basis, and the
  # P0130/P0131/P0132 order caps. Gated to migration/script changes; required
  # via the CI green aggregate below.
  # ------------------------------------------------------------------
  clob-invariants:
    name: CLOB invariants (ephemeral PG)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install psycopg2
        run: pip install psycopg2-binary
      - name: Install PostgreSQL 17 + http extension (PGDG)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-17-http
      - name: Run CLOB invariant harnesses (ephemeral Postgres, rolled back)
        env:
          PG_BINDIR: /usr/lib/postgresql/17/bin
          FUZZ_N: '5000'
        run: bash scripts/ci/run_clob_invariants.sh

  # ------------------------------------------------------------------
  # CICD-01 — Aggregate required check.
  # A single, stable status branch protection can require regardless of
  # which paths changed. It `needs:` every gating job and runs `always()`.
  # It FAILS if any needed job failed or was cancelled, and PASSES when the
  # jobs succeeded OR were skipped-by-design by change-detection.
  # Configure branch protection to require ONLY this "CI green" check.
  # ------------------------------------------------------------------
  ci-required:
    name: CI green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - type-check
      - unit
      - i18n
      - build
      - migration-lint
      - security
      - dependency-review
      - e2e
      - clob-invariants
    steps:
      - name: Verify required jobs passed or were skipped-by-design
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Needed job results:"
          echo "$RESULTS" | jq .
          # 'success' and 'skipped' (change-detection) are acceptable.
          # 'failure' and 'cancelled' must fail the aggregate check.
          failed=$(echo "$RESULTS" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | .[].key')
          if [ -n "$failed" ]; then
            echo "::error title=CI green::Required jobs did not pass (failure/cancelled): $failed"
            exit 1
          fi
          echo "All required jobs succeeded or were skipped by design — CI is green."
