# Deploy to STAGING (Module 16.3)
# Auto-runs on merge to main: migrate (ordered, expand/contract) -> deploy Fly
# (health-gated rolling/canary) -> post-deploy smoke. The built image is
# published to Fly's registry so deploy-production can promote it BY DIGEST.
name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_APP: kichiko-staging
  FLY_REGION: jnb

jobs:
  deploy-staging:
    name: Migrate + Deploy (staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.kichiko.example
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # --- Ordered DB migration BEFORE app cutover (expand/contract) ---
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      # Migrations connect straight to the database through the Supabase session
      # pooler with SUPABASE_PROJECT_ID + SUPABASE_DB_PASSWORD. No Supabase
      # access token (management API) is needed: `supabase link` was the only
      # step that used it, and an expired token failed every deploy with
      # "Unauthorized". Pooler host: vars.SUPABASE_POOLER_HOST, default
      # eu-west-1 (the project's region). A missing secret skips cleanly.
      - name: Check staging DB credentials
        id: dbcheck
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Staging migration skipped::SUPABASE_PROJECT_ID / SUPABASE_DB_PASSWORD not configured; skipping db push."
          fi
      - name: Push migrations (staging)
        if: steps.dbcheck.outputs.configured == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST || 'aws-0-eu-west-1.pooler.supabase.com' }}
        run: |
          set +e
          PW=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$PW"
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_ID}:${PW}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$DB_URL"

          # 1. Dry run: list exactly what would be applied.
          dry="$(supabase db push --db-url "$DB_URL" --dry-run 2>&1)"
          code=$?
          echo "$dry"
          if [ $code -ne 0 ]; then
            if echo "$dry" | grep -qiE "failed to connect|i/o timeout|connection refused|no such host|context deadline|dial tcp|timeout"; then
              echo "::warning title=Staging DB unreachable::Could not reach the staging database (connectivity); skipping migration for this run without failing the pipeline."
              exit 0
            fi
            echo "::error title=Migration dry run failed::supabase db push --dry-run failed (credentials or project id?)."
            exit $code
          fi
          # 2. Guard: the database's migration history must already include the
          #    base schema. If the dry run would apply 001, the history table does
          #    not match this repo and pushing could replay old migrations.
          if echo "$dry" | grep -q "001_initial_schema"; then
            echo "::error title=Migration history mismatch::The dry run would re-apply 001_initial_schema. Repair the history (supabase migration repair --status applied <versions>) before pushing. Nothing was applied."
            exit 1
          fi
          # 3. Apply.
          out="$(supabase db push --db-url "$DB_URL" 2>&1)"
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error title=Migration failed::supabase db push failed; see the output above."
            exit $code
          fi
          # 4. Read-only post-migration report: escrow invariant (migration 082).
          #    Aggregates only (no wallet or user ids in the log).
          if command -v psql >/dev/null 2>&1; then
            psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 <<'SQL' || echo "::warning title=Post-migration report failed::could not run the read-only report"
          BEGIN READ ONLY;
          SELECT 'reservation drift: ' || count(*) || ' wallet(s), net ' || COALESCE(sum(drift), 0)
            FROM public.wallet_reservation_drift();
          SELECT 'last reconcile: ' || created_at || ' fixed=' || (new_data->>'wallets_fixed')
                 || ' cancelled_unfunded=' || (new_data->>'orders_cancelled_unfunded')
                 || ' unfunded_wallets=' || jsonb_array_length(new_data->'unfunded_wallets')
            FROM public.audit_log WHERE action = 'reconcile_wallet_reservations'
           ORDER BY created_at DESC LIMIT 1;
          ROLLBACK;
          SQL
          fi

      # --- Preflight: only attempt the Fly deploy when credentials exist. ---
      # A missing FLY_API_TOKEN means the staging Fly app isn't provisioned for
      # this environment; skip the Fly build/deploy/smoke steps cleanly instead
      # of hard-failing the whole run (the DB migration above still applies).
      - name: Check Fly credentials
        id: flycheck
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Staging deploy skipped::FLY_API_TOKEN is not configured — skipping Fly build/deploy/smoke. Migrations were still applied."
          fi

      # --- Build + publish an immutable image, capture its digest ---
      - name: Setup Fly CLI
        if: steps.flycheck.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build & push image (record digest)
        id: publish
        if: steps.flycheck.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          IMAGE="registry.fly.io/${FLY_APP}:${GITHUB_SHA}"
          flyctl deploy \
            --app "$FLY_APP" \
            --build-only --push \
            --image-label "$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          # Resolve the immutable digest so prod can promote the SAME artifact.
          DIGEST="$(flyctl image show --app "$FLY_APP" 2>/dev/null | awk '/registry.fly.io/ {print $NF}' | head -1 || true)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE (digest: ${DIGEST:-unknown})"

      # --- Health-gated deploy (Fly aborts cutover if checks fail) ---
      - name: Deploy to staging (health-gated)
        if: steps.flycheck.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app "$FLY_APP" \
            --image "registry.fly.io/${FLY_APP}:${GITHUB_SHA}" \
            --strategy canary

      # --- Post-deploy smoke gates the run (and thus any promotion) ---
      - name: Post-deploy smoke
        if: steps.flycheck.outputs.configured == 'true'
        run: |
          chmod +x scripts/smoke.sh
          scripts/smoke.sh "https://${FLY_APP}.fly.dev"
