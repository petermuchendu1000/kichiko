# Deploy to PRODUCTION (Module 16.3 / 16.6)
# Approval-gated (GitHub Environment "production" with required reviewers).
# Triggered by a semver tag (v*) or manual dispatch. Promotes the EXACT image
# validated on staging BY DIGEST — no rebuild — then migrates prod (ordered)
# and does a health-gated cutover with a post-deploy smoke. On failure the
# prior release keeps serving (auto-abort); use rollback.yml for a fast revert.
name: Deploy Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Fully-qualified image (registry.fly.io/kichiko-staging@sha256:... or :tag) to promote'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_APP: kichiko-prod
  STAGING_APP: kichiko-staging

jobs:
  deploy-production:
    name: Promote image -> Production (approval-gated)
    runs-on: ubuntu-latest
    environment:
      name: production          # <-- required reviewers configured in repo settings
      url: https://app.kichiko.example
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Resolve the image to promote. Tag builds promote the current staging
      # image by digest; manual dispatch promotes the provided image_ref.
      - name: Resolve promotion image (by digest)
        id: img
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [[ -n "${{ github.event.inputs.image_ref }}" ]]; then
            IMAGE="${{ github.event.inputs.image_ref }}"
          else
            # Pin the digest currently running on staging for guaranteed parity.
            DIGEST="$(flyctl image show --app "$STAGING_APP" --json | jq -r '.[0].Digest // .Digest')"
            REPO="$(flyctl image show --app "$STAGING_APP" --json | jq -r '.[0].Repository // .Repository')"
            IMAGE="${REPO}@${DIGEST}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Promoting: ${IMAGE}"

      # --- Ordered prod DB migration BEFORE cutover ---
      # setup-cli resolves 'latest' through the GitHub API, which rate-limits
      # shared runners (run 36258199295 failed before any migration step).
      # Fall back to the npm distribution of the same CLI.
      - name: Setup Supabase CLI
        id: supabase_cli
        continue-on-error: true
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Setup Supabase CLI (npm fallback)
        if: steps.supabase_cli.outcome == 'failure'
        run: |
          # the npm package does not support global installs: install it locally
          npm install --no-save --prefix "$RUNNER_TEMP/supabase-cli" supabase
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/supabase-cli/node_modules/.bin/supabase" --version
      # audit 6.32: the same method as Deploy Staging (proven on every main
      # push): the pooler DB URL (the access-token `supabase link` path failed
      # there with "Unauthorized"), a dry run, the migration-history guard, and
      # any failure stops the job before the cutover.
      - name: Push migrations (production)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PROD_SUPABASE_PROJECT_ID }}
          POOLER_HOST: ${{ vars.PROD_SUPABASE_POOLER_HOST || vars.SUPABASE_POOLER_HOST || 'aws-0-eu-west-1.pooler.supabase.com' }}
        run: |
          set -eo pipefail
          if [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error title=Production migration not run::PROD_SUPABASE_PROJECT_ID / PROD_SUPABASE_DB_PASSWORD not configured."
            exit 1
          fi
          PW=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$PW"
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_ID}:${PW}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$DB_URL"
          dry="$(supabase db push --db-url "$DB_URL" --dry-run 2>&1)" || { echo "$dry"; echo "::error title=Migration dry run failed::nothing was applied."; exit 1; }
          echo "$dry"
          if echo "$dry" | grep -q "001_initial_schema"; then
            echo "::error title=Migration history mismatch::The dry run would re-apply 001_initial_schema. Repair the history before pushing. Nothing was applied."
            exit 1
          fi
          supabase db push --db-url "$DB_URL"

      # --- Health-gated cutover of the promoted image ---
      - name: Deploy to production (health-gated)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app "$FLY_APP" \
            --image "${{ steps.img.outputs.image }}" \
            --strategy bluegreen

      - name: Post-deploy smoke
        run: |
          chmod +x scripts/smoke.sh
          scripts/smoke.sh "https://${FLY_APP}.fly.dev"

      # --- Traceability record: image digest <-> tag <-> commit ---
      - name: Record release provenance
        run: |
          echo "Release: ${GITHUB_REF_NAME}"
          echo "Image:   ${{ steps.img.outputs.image }}"
          echo "Commit:  ${GITHUB_SHA}"
